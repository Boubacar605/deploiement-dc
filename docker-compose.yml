services:
  postgres:
    image: postgres:16-alpine
    container_name: xeuysil-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - xeuysil-net

  serveur:
    image: ${DOCKER_REGISTRY}/serveur:${IMAGE_TAG}
    container_name: xeuysil-serveur
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - xeuysil-net

  client:
    image: ${DOCKER_REGISTRY}/client:${IMAGE_TAG}
    container_name: xeuysil-client
    depends_on:
      - serveur
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - xeuysil-net

  nginx:
    build: ./nginx
    container_name: xeuysil-nginx
    ports:
      - "8080:80"
    depends_on:
      serveur:
        condition: service_healthy
      client:
        condition: service_started
    restart: unless-stopped
    networks:
      - xeuysil-net

volumes:
  pgdata:
    name: xeuysil_pgdata

networks:
  xeuysil-net:
    name: xeuysil-net
